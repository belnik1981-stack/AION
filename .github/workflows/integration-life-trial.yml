name: AION integration life trial

on:
  push:
    branches:
      - integration-life-trial-v1-20261015
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-life-trial:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Run bounded offline life trial
        run: bash scripts/full_life_test.sh
