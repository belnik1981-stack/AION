name: AION integration life trial

on:
  push:
    branches:
      - integration-life-trial-v1-20261015
      - integration/aion-pr1-pr5-validation-20261016
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-life-trial:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Validate startup shell
        run: sh -n start_app.sh
      - name: Validate one-request live probe script syntax
        run: bash -n scripts/live_probe.sh
      - name: Validate Critic live probe script syntax
        run: bash -n scripts/live_critic_probe.sh
      - name: Validate pinned model catalog preflight offline
        run: PYTHONPATH=. python tests/harness/test_free_model_catalog_preflight.py
      - name: Test bounded free-model live driver with mocked provider
        run: PYTHONPATH=. python tests/harness/test_live_free_pipeline_trial.py
      - name: Verify two-model comparison and guard regression
        run: PYTHONPATH=. python tests/harness/test_multi_model_runtime_regression.py && PYTHONPATH=. python tests/harness/test_live_free_multi_model_trial.py
      - name: Validate two-model live script syntax
        run: bash -n scripts/live_two_model_probe.sh
      - name: Validate pinned-model smoke script
        run: bash -n scripts/live_pinned_pipeline_probe.sh
      - name: Run bounded offline life trial
        run: bash scripts/cloud_check.sh
